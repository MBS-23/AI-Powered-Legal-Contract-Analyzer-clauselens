[theme]
base = "dark"
primaryColor = "#D6B35A"          # gold accent
backgroundColor = "#071525"       # deep navy
secondaryBackgroundColor = "#0D2235"
textColor = "#F5F3ED"             # off-white
font = "sans serif"

[server]
maxUploadSize = 15                 # matches security.MAX_UPLOAD_BYTES
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
